[package]
name = "corpusfetch-mcp"
version = "1.0.5"
edition = "2021"
description = "MCP server for CorpusFetch — O(1) symptom routing over 622 concluded records"

[dependencies]
rmcp = { version = "0.17", features = ["server", "macros", "transport-streamable-http-server", "transport-streamable-http-server-session"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs"] }
tokio-util = "0.7"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
